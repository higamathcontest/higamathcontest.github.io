<!DOCTYPE html>
<!--
  **** 重要 ****
  htmlタグのdata-problem-number に problems.problem_number を埋め込む。
  例: data-problem-number="A1"
-->
<html lang="ja" data-problem-number="N2">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem | HiGA Math Contest</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/problems-detail.css">
  <link rel="stylesheet" href="/css/problem-solution.css">
  <script type="module" src="/js/supabase-client.js"></script>
  <script type="module" src="/js/redirect.js"></script>
  <script src="/js/hamburger-menu.js" defer></script>
  <script type="module" src="/js/signup.js"></script>
  <script type="module" src="/js/calculator.js"></script>
  <script type="module" src="/js/problems-detail.js"></script>
  <script type="module" src="/js/problem-solution.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body class="problem-bg">
  <header class="problem-header">
    <a class="back-btn" href="/contest/problems/">← 戻る</a>
    <div class="problem-meta">
      <div class="problem-title">読み込み中...</div>
      <div class="problem-sub">Points: <span class="pts">--</span></div>
    </div>
  </header>

  <main class="problem-wrap">

    <my-calculator></my-calculator>

    <section class="panel statement-panel">
      <div class="statement-heading">
        <h2>問題</h2>

        <button
          class="solution-open-btn"
          id="solution-open-btn"
          type="button"
          aria-haspopup="dialog"
          aria-controls="solution-modal"
          aria-expanded="false"
          hidden
        >
          解答・解説を見る
        </button>
      </div>
      <p>
        \(9!\times 9=n!-9!\) となる \(n\) を求めよ。
      </p>
    </section>

    <section class="panel submit-panel">
      <h2>解答</h2>
      <form id="answer-form">
        <div class="answer-row">
          <input
            type="text"
            name="answer"
            placeholder="ここに回答を入力"
            autocomplete="off"
            required
          >
          <button type="submit">提出</button>
        </div>
      </form>

      <p id="remaining-count" class="remaining-msg">読み込み中...</p>

      <p class="submit-note">
        問題の指示に従って解答を非負整数で入力してください。<br>
        正しくないジャッジ結果となるのを防ぐため、解答に空白文字を含まないようにしてください。
      </p>
    </section>
  </main>

  <dialog
    class="solution-modal"
    id="solution-modal"
    aria-labelledby="solution-modal-title"
  >
    <div class="solution-modal-inner">
      <div class="solution-modal-head">
        <h2 id="solution-modal-title">解答・解説</h2>

        <button
          class="solution-close-btn"
          id="solution-close-btn"
          type="button"
          aria-label="解答・解説を閉じる"
        >
          ×
        </button>
      </div>

      <div class="solution-modal-body">
        <p class="solution-answer">
          <strong>答え：</strong>
          <span id="solution-answer"></span>
        </p>

        <div id="solution-explanation"></div>
      </div>
    </div>
  </dialog>


  <footer class="problem-footer">
    © HiGA Math Contest
  </footer>
</body>
</html>
